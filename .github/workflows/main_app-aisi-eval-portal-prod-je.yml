# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - app-aisi-eval-portal-prod-je

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: ./frontend/app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          # 💡相性の良い安定版の「20.x」に少しだけ戻してあげます
          node-version: '20.x'

      - name: npm install and build (Skip Type Check)
        run: |
          npm install
          # 💡【ここを修正】厳しいお説教（vue-tsc）を無視して、直接Viteで画面を作らせる魔法のコマンドです
          npx vite build

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./frontend/app/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
        
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_FC5441E2AE07462DB93D3A1AD9563137 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2E99814EB5FC4153A8D7E33D8937370D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E445C881BBE745B79E9A9FC0AEFF049F }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-aisi-eval-portal-prod-je'
          slot-name: 'Production'
          package: .
